[project]
name = "exputils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1.57",
    "omegaconf>=2.3.1",
    "pandas>=2.3.3",
    "wandb>=0.28.1",
    "matplotlib"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = {"src" =  ""}
