# Standard run config.
# Usage: python train.py --config-name run
#
# Uncomment alternatives as needed.

defaults:
  - my_config           # structured config registered in ConfigStore
  - paths               # directory structure
  # - override hydra/launcher: slurm     # uncomment for cluster
  - _self_

wandb_project: a_random_project
group: my_experiment
log_to_wandb: false

# --- Seed ---
# Local / single task:
seed: 0
# Multi-task SLURM (ntasks > 1), each task gets seed = base_seed + SLURM_PROCID.
# Sweep base_seed, not seed: base_seed=0,3 with ntasks=3 gives seeds 0-5, whereas a plain
# seed=0,3 replaces the resolver and runs ntasks identical copies in the same directory.
# seed: ${slurm_seed:${base_seed}}

# --- Results path ---
# Local:
# path_results: results
# Cluster:
# path_results: /work/my_cluster_path/results
